detg.mobile:
  label: mobile
  mediaQuery: '(max-width: 767px)'
  weight: 1
  multipliers:
    - 1x
detg.tablet:
  label: tablet
  mediaQuery: 'all and (min-width: 768px) and (max-width: 1023px)'
  weight: 2
  multipliers:
    - 1x
    - 2x
detg.desktop:
  label: desktop
  mediaQuery: '(min-width: 1024px)'
  weight: 3
  multipliers:
    - 1x
    - 2x
